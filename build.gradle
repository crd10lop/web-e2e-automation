buildscript {
    repositories {
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath("net.serenity-bdd.serenity-gradle-plugin:net.serenity-bdd.serenity-gradle-plugin.gradle.plugin:3.3.4")
    }
}

apply plugin: 'java'
apply plugin: 'net.serenity-bdd.serenity-gradle-plugin'

sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
}

ext {
    serenityVersion         = '3.3.4'
    serenityCucumberVersion = '3.3.4'
    serenityWebVersion      = '3.3.4'
    junitVersion            = '4.13.2'
    lombokVersion           = '1.18.24'
}

dependencies {
    implementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-junit:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-cucumber:${serenityCucumberVersion}"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityWebVersion}"
    implementation 'org.slf4j:slf4j-simple:2.0.5'
    implementation group: 'org.apache.commons', name: 'commons-dbcp2', version: '2.12.0'

    testImplementation "junit:junit:${junitVersion}"
    testImplementation 'org.hamcrest:hamcrest-all:1.3'
    testImplementation "io.github.bonigarcia:webdrivermanager:5.6.3"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

test {
    testLogging.showStandardStreams = true
    systemProperties System.getProperties()
}
